name: note_app
description: "Note app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_svg: ^2.0.14
  shared_preferences: ^2.3.3
  persistent_bottom_nav_bar_v2: ^5.3.1
  intl: ^0.19.0
  fluttertoast: ^8.2.8
  fluid_dialog: ^2.0.0
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  flutter_pdfview: ^1.3.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_sharing_intent: ^1.1.1
  sqflite: ^2.4.1
  path: ^1.9.0
  pull_to_refresh: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#22222F"
  image: assets/icons/logo.png
  image_dark: assets/icons/logo.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: TiltNeon
      fonts:
        - asset: assets/fonts/TiltNeon-Regular.ttf
