name: note_app
description: "Note app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dynamic_color: ^1.7.0
  flutter_svg: ^2.0.14
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  fluttertoast: ^8.2.14
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"

  # --- The Adaptive Icon Settings for Android ---
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"

  min_sdk_android: 21

flutter_native_splash:
  color: "#EBE8EC"
  image: "assets/icons/icon_foreground.png"

  color_dark: "#1A1B20"
  image_dark: "assets/icons/icon_foreground_dark.png"

  android_12:
    color: "#EBE8EC"
    image: "assets/icons/icon_foreground.png"

    color_dark: "#1A1B20"
    image_dark: "assets/icons/icon_foreground_dark.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: TiltNeon
      fonts:
        - asset: assets/fonts/TiltNeon-Regular.ttf
